- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/dev
    - ~/projects

- link:
    ~/.gitconfig:
      path: .gitconfig
      force: true
    ~/.gitignore_global:
      path: .gitignore_global
    ~/.p10k.zsh:
      path: .p10k.zsh
      force: true
    ~/.zshrc:
      path: .zshrc
      force: true
    ~/.zlogin:
      path: .zlogin
      force: true
    ~/.zshenv:
      path: .zshenv
      force: true

- shell:
    - command: git submodule update --init --recursive
      description: Installing submodules
    - command: ./ubuntu/setup.sh
      description: Installing packages and fonts
      stdout: true
      stderr: true
      stdin: true
    - command: if [ ! -f "$HOME/.netrc" ]; then touch "$HOME/.netrc"; fi
      description: Creating $HOME/.netrc
    - command: mkdir -p "$HOME/.config/uv" && printf 'cache-dir = "%s/.cache/dev/uv"\n' "$HOME" > "$HOME/.config/uv/uv.toml"
      description: Pointing the uv cache at ~/.cache/dev (uv.toml expands neither ~ nor $HOME, so it is generated)
    - command: if [[ ! -d "$HOME"/.oh-my-zsh ]]; then git clone https://github.com/ohmyzsh/ohmyzsh.git "$HOME"/.oh-my-zsh; fi
      description: Installing oh-my-zsh
    - command: if [[ ! -d "$HOME"/powerlevel10k ]]; then git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "$HOME"/powerlevel10k; fi
      description: Installing Powerlevel10k
    - command: sudo install -d -m 755 /etc/claude-code/managed-settings.d && sudo install -m 644 claude/managed-settings.d/*.json /etc/claude-code/managed-settings.d/
      description: Installing Claude Code managed security settings (copied, root-owned)
      stdin: true
    - command: 'if [[ "$(getent passwd "$(whoami)" | cut -d: -f7)" != */zsh ]]; then chsh -s /usr/bin/zsh; fi'
      description: Changing shell to ZSH
      stdin: true
    - command: if ! ls "$HOME"/.ssh/id_* &>/dev/null; then mkdir -p "$HOME"/.ssh && ssh-keygen -t ed25519 -f "$HOME"/.ssh/id_ed25519; fi
      description: Creating an SSH key if there is none
      stdout: true
      stderr: true
      stdin: true
